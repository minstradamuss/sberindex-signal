[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sberindex-signal"
version = "1.0.0"
description = "Causal panel forecasting and structural-break monitoring for SberIndex"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "catboost", "lightgbm", "pyarrow", "pyyaml", "matplotlib", "requests", "prophet", "reportlab", "tabulate"]

[project.optional-dependencies]
foundation = ["chronos-forecasting"]
dev = ["pytest", "nbformat"]

[project.scripts]
signal-run = "signalcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
